aid: nestcoin
name: Nestcoin
description: >-
  Nestcoin is an African fintech company building Onboard, a digital-money platform and crypto
  exchange for on/off-ramping between fiat and crypto. Its developer product, Onboard Connect, is
  the SDK & API integration layer over Onboard Exchange, giving Web2 and Web3 builders access to a
  ready-made peer-to-peer marketplace, liquidity, offers/pricing, orders, beneficiaries, and payout
  accounts. The public Onboard External API Gateway (OpenAPI 3.0.3, v3.0.2) exposes 96 operations
  across users/auth, offers, orders, accounts, and webhooks, secured with API keys, session tokens,
  and HMAC-SHA256 request signing. Nestcoin is backed by Coinbase Ventures, Base Ecosystem, HashKey
  Capital, Hashed Emergent, Distributed Global, Electric Capital, and others.
